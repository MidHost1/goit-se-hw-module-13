<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Новий пароль</title>
</head>
<body style="font-family: sans-serif; max-width: 360px; margin: 60px auto;">
<h2>Новий пароль</h2>
<form id="f">
    <input id="p" type="password" minlength="6" required placeholder="Введіть новий пароль"
           style="width: 100%; padding: 8px; margin-bottom: 12px;">
    <button type="submit" style="padding: 8px 16px;">Змінити пароль</button>
</form>
<p id="m"></p>
<script>
    const token = location.pathname.split("/").pop();
    document.getElementById("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const r = await fetch("/auth/reset_password/" + token, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({new_password: document.getElementById("p").value}),
        });
        const d = await r.json();
        document.getElementById("m").textContent =
            r.ok ? d.message : (typeof d.detail === "string" ? d.detail : "Пароль не підходить (мінімум 6 символів)");
    });
</script>
</body>
</html>
