<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Password reset</title>
</head>
<body>
<p>Привіт, {{email}}!</p>
<p>Ми отримали запит на скидання пароля. Посилання діє 30 хвилин:</p>
<p><a href="{{host}}auth/reset_password/{{token}}">Скинути пароль</a></p>
<p>Якщо це були не ви, просто проігноруйте лист: пароль не зміниться.</p>
</body>
</html>
