<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Confirm email</title>
</head>
<body>
<p>Привіт, {{email}}!</p>
<p>Дякуємо за реєстрацію в Contacts API.</p>
<p>Щоб підтвердити свою пошту, натисни на посилання:</p>
<p><a href="{{host}}auth/confirmed_email/{{token}}">Підтвердити email</a></p>
<p>Якщо ти не реєструвався, просто проігноруй цей лист.</p>
</body>
</html>
